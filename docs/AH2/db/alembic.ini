[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# sqlalchemy.url is intentionally NOT set here — env.py reads
# AH2_DATABASE_URL from C:\alphahound_project\.env at runtime instead, so
# no connection string or credential ever lives in a committed file.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
