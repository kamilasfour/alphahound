<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlphaHound — Access</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#111722; --line:#1e2836;
    --text:#e6edf3; --muted:#7d8aa0; --accent:#f5a623; --accent2:#ffc234;
    --err:#ff5c5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #16202e 0%, var(--bg) 60%);
    color:var(--text); font:15px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;
  }
  .card{
    width:100%; max-width:380px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:34px 30px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:6px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 14px var(--accent)}
  .brand h1{font-size:18px; margin:0; letter-spacing:.06em}
  .sub{color:var(--muted); font-size:12.5px; margin:0 0 26px}
  label{display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); margin-bottom:8px}
  input{
    width:100%; background:#0c1219; border:1px solid var(--line); color:var(--text);
    border-radius:9px; padding:13px 14px; font:inherit; letter-spacing:.18em; text-align:center;
    outline:none; transition:border-color .15s;
  }
  input:focus{border-color:var(--accent)}
  button{
    width:100%; margin-top:16px; padding:13px; border:0; border-radius:9px; cursor:pointer;
    background:linear-gradient(180deg,var(--accent2),var(--accent)); color:#1a1206;
    font:inherit; font-weight:700; letter-spacing:.06em; transition:filter .15s,opacity .15s;
  }
  button:hover{filter:brightness(1.06)}
  button:disabled{opacity:.55; cursor:default}
  .msg{min-height:18px; margin-top:14px; font-size:12.5px; text-align:center; color:var(--err)}
  .foot{margin-top:22px; text-align:center; font-size:11px; color:var(--muted)}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="dot"></span><h1>ALPHAHOUND</h1></div>
    <p class="sub">Multi-Pillar Convergence Engine — restricted access</p>

    <label for="code">Access code</label>
    <input id="code" type="password" autocomplete="off" autofocus
           inputmode="text" placeholder="&bull; &bull; &bull; &bull;" />
    <button id="go">Unlock</button>
    <div class="msg" id="msg"></div>

    <div class="foot">Internal use only &middot; session persists on this device</div>
  </div>

<script>
  const codeEl = document.getElementById('code');
  const btn    = document.getElementById('go');
  const msg    = document.getElementById('msg');

  async function submit(){
    const code = codeEl.value.trim();
    if(!code){ codeEl.focus(); return; }
    btn.disabled = true; msg.textContent = '';
    try{
      const r = await fetch('/api/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ code })
      });
      if(r.ok){
        try{
          if(!localStorage.getItem('ah_onboarded')){
            sessionStorage.setItem('ah_show_walkthrough','1');
          }
        }catch(e){}
        window.location.href = '/';
      } else {
        const d = await r.json().catch(()=>({}));
        msg.textContent = d.error || 'Invalid access code';
        codeEl.select();
      }
    }catch(e){
      msg.textContent = 'Network error — is the server up?';
    }finally{
      btn.disabled = false;
    }
  }

  btn.addEventListener('click', submit);
  codeEl.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
</script>
</body>
</html>
