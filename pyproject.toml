[project]
name = "alphahound"
version = "0.0.3"
description = "AlphaHound — multi-industry sentiment intelligence engine"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
    "transformers>=4.40",
    "torch>=2.3",
    "numpy>=1.26",
    "alpaca-trade-api>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
alphahound = "alphahound.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphahound"]
